<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>三日坊主以降の坊主</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Noto Sans JP", sans-serif; background:#111; color:#eee; }
    header { position: sticky; top:0; z-index:10; background:rgba(17,17,17,.94); backdrop-filter: blur(12px); border-bottom:1px solid #333; padding:14px 16px; }
    h1 { margin:0; font-size:20px; }
    header p { margin:5px 0 0; color:#aaa; font-size:12px; }
    main { width:min(100%, 760px); margin:0 auto; padding:18px 12px 60px; }
    .episode { margin:0 0 26px; border:1px solid #333; border-radius:16px; overflow:hidden; background:#181818; }
    .episode-head { padding:16px; display:flex; gap:12px; align-items:flex-start; justify-content:space-between; }
    .episode h2 { font-size:18px; margin:0 0 5px; }
    .meta { font-size:12px; color:#999; }
    .badge { flex:none; font-size:11px; border:1px solid #555; padding:4px 8px; border-radius:999px; color:#bbb; }
    .pages { background:#fff; }
    .pages img { display:block; width:100%; height:auto; margin:0; }
    .empty { padding:36px 20px; text-align:center; color:#777; background:#f4f4f4; }
    .links { padding:0 16px 16px; }
    .links a { color:#ddd; text-decoration:none; border-bottom:1px solid #666; }
    footer { text-align:center; color:#666; font-size:12px; padding:20px; }
  </style>
</head>
<body>
<header>
  <h1>三日坊主以降の坊主</h1>
  <p>4日目以降の坊主は、いったい何者なのか。</p>
</header>
<main id="app"><p>読み込み中……</p></main>
<footer>mikka-bozu / kitune2go</footer>
<script>
(async () => {
  const app = document.getElementById('app');
  try {
    const data = await fetch('./data/episodes.json', {cache:'no-store'}).then(r => r.json());
    app.innerHTML = '';
    [...data.episodes].reverse().forEach(ep => {
      const article = document.createElement('article');
      article.className = 'episode';
      const pages = (ep.pages || []).map(src => `<img loading="lazy" src="${src}" alt="${ep.title}">`).join('');
      article.innerHTML = `
        <div class="episode-head">
          <div><h2>第${ep.number}話　${ep.title}</h2><div class="meta">${ep.date || ''}</div></div>
          <span class="badge">${ep.pages?.length ? ep.pages.length + 'ページ' : '台本'}</span>
        </div>
        <div class="pages">${pages || '<div class="empty">作画ファイル準備中<br>台本は下から読めます。</div>'}</div>
        <div class="links"><a href="${ep.script}">台本を見る</a></div>`;
      app.appendChild(article);
    });
  } catch (e) {
    app.innerHTML = '<p>作品一覧を読み込めませんでした。</p>';
    console.error(e);
  }
})();
</script>
</body>
</html>
